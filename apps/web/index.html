<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#edf1fc" />
    <!--
      Boot theme: applies the cached theme before first paint so a dark user never sees a light
      flash. Keep in line with resolveTheme/applyTheme in src/theme/theme.ts (theme-boot.test.ts).
    -->
    <script>
      (function () {
        try {
          var p = 'system';
          try {
            var s = JSON.parse(localStorage.getItem('atrium.theme') || 'null');
            var v = s && s.state && s.state.preference;
            if (v === 'light' || v === 'dark' || v === 'black') p = v;
          } catch (e) {}
          var t =
            p === 'system'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : p;
          var r = document.documentElement;
          r.classList.add(t + '-app-theme');
          r.style.colorScheme = t === 'light' ? 'light' : 'dark';
          var c = { light: '#edf1fc', dark: '#181b34', black: '#111111' }[t];
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', c);
        } catch (e) {}
      })();
    </script>
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon-light.svg?v=2"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg?v=2"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atrium" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/theme/fonts/figtree-latin-400-normal.woff2"
      crossorigin
    />
    <title>Atrium</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
